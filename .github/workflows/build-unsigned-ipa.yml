      - name: Patch iOS 16 availability boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("sing-box-for-apple/SFI/MainView.swift")
          text = source.read_text()
          declaration = "    private func sidebarPageContent(for page: NavigationPage, remoteControlInToolbar: Bool) -> some View {"
          annotated = "    @available(iOS 16.0, *)\n" + declaration

          if annotated in text:
              print("Availability annotation already present; no change needed")
          elif text.count(declaration) == 1:
              source.write_text(text.replace(declaration, annotated, 1))
              print("Marked sidebarPageContent as iOS 16+, matching its only call sites")
          else:
              raise SystemExit("Expected MainView.swift declaration exactly once; refusing unsafe patch")
          PY

      - name: Expose sing-box Documents folder in Files app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path("sing-box-for-apple/sing-box.xcodeproj/project.pbxproj")
          lines = project.read_text().splitlines()
          app_configs = [i for i, line in enumerate(lines) if "INFOPLIST_FILE = SFI/Info.plist;" in line]
          if len(app_configs) != 2:
              raise SystemExit(f"Expected 2 SFI app configurations, found {len(app_configs)}")

          inserted = 0
          for start in app_configs:
              end = next((i for i in range(start, min(start + 80, len(lines)))
                          if "INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace = YES;" in lines[i]), None)
              if end is None:
                  raise SystemExit(f"Could not find document-location setting near line {start + 1}")
              if end + 1 < len(lines) and "INFOPLIST_KEY_UIFileSharingEnabled = YES;" in lines[end + 1]:
                  continue
              indent = lines[end][:len(lines[end]) - len(lines[end].lstrip())]
              lines.insert(end + 1, indent + "INFOPLIST_KEY_UIFileSharingEnabled = YES;")
              inserted += 1

          result = "\n".join(lines) + "\n"
          if result.count("INFOPLIST_KEY_UIFileSharingEnabled = YES;") != 2:
              raise SystemExit("Expected exactly two UIFileSharingEnabled settings after patch")
          project.write_text(result)
          print(f"Enabled Files app sharing in both SFI app configurations; inserted {inserted} setting(s)")
          PY


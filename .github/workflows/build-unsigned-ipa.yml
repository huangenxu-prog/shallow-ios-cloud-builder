name: Build Unsigned sing-box iOS IPA

on:
  workflow_dispatch:
    inputs:
      base_package_identifier:
        description: "App bundle identifier authorized by the provisioning profile"
        required: true
        type: string
        default: "io.nekohasekai.sfamt1"
      app_group_identifier:
        description: "App Group shared by the app and Packet Tunnel extension"
        required: true
        type: string
        default: "group.2V688SXB74.3oyGlI"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: Clone sing-box core
        run: |
          git clone --depth 1 --branch testing \
            https://github.com/huangenxu-prog/sing-box.git sing-box

      - name: Apply REALITY X25519MLKEM768 compatibility patch
        working-directory: sing-box
        run: |
          git fetch --depth=2 https://github.com/mkd47/sing-box.git 8b4a23018b53b62891b832a1c497f70be09c800c
          git diff FETCH_HEAD^ FETCH_HEAD -- common/tls/reality_client.go > /tmp/reality-mlkem.patch
          test -s /tmp/reality-mlkem.patch
          git apply --check /tmp/reality-mlkem.patch
          git apply /tmp/reality-mlkem.patch
          git diff --check
          git diff --stat

      - name: Clone Apple client and submodules
        run: |
          git clone --depth 1 --branch dev --recurse-submodules \
            https://github.com/SagerNet/sing-box-for-apple.git sing-box-for-apple

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache-dependency-path: sing-box/go.sum

      - name: Test REALITY compatibility patch
        working-directory: sing-box
        run: |
          go test -tags with_utls ./common/tls/

      - name: Install gomobile tools
        working-directory: sing-box
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12

      - name: Enable gVisor in Apple Libbox build
        working-directory: sing-box
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("cmd/internal/build_libbox/main.go")
          text = source.read_text()
          anchor = 'sharedTags = append(sharedTags, "with_quic",'
          replacement = 'sharedTags = append(sharedTags, "with_gvisor", "with_quic",'
          if text.count(anchor) != 1:
              raise SystemExit("Could not uniquely locate shared Apple build tags")
          text = text.replace(anchor, replacement, 1)
          if '"with_gvisor"' not in text:
              raise SystemExit("gVisor build tag was not added")
          source.write_text(text)
          print("Enabled with_gvisor for all Apple Libbox variants")
          PY

      - name: Add runtime network-interface diagnostics (no behavior changes)
        run: |
          python3 - <<'PY'
          from pathlib import Path

          go = Path("sing-box/route/network.go")
          source = go.read_text()
          anchor = "\t\toldInterfaces := r.networkInterfaces.Load()\n\t\tnewInterfaces := common.Filter(interfaces, func(it adapter.NetworkInterface) bool {"
          replacement = "\t\tif C.IsDarwin {\n\t\t\tr.logger.Error(\"NETWORK_DIAG interfaces before net.FlagUp filter: \", strings.Join(common.Map(interfaces, func(it adapter.NetworkInterface) string {\n\t\t\t\treturn F.ToString(\"name=\", it.Name, \" index=\", it.Index, \" flags=\", it.Flags, \" type=\", it.Type)\n\t\t\t}), \" | \"))\n\t\t}\n" + anchor
          if source.count(anchor) != 1:
              raise SystemExit("Go diagnostic insertion anchor is not unique")
          source = source.replace(anchor, replacement, 1)
          anchor2 = "\t\tr.networkInterfaces.Store(newInterfaces)\n\t\tif len(newInterfaces) > 0"
          replacement2 = "\t\tr.networkInterfaces.Store(newInterfaces)\n\t\tif C.IsDarwin {\n\t\t\tr.logger.Error(\"NETWORK_DIAG interfaces after net.FlagUp filter: count=\", len(newInterfaces))\n\t\t}\n\t\tif len(newInterfaces) > 0"
          if source.count(anchor2) != 1:
              raise SystemExit("Go filtered-count insertion anchor is not unique")
          go.write_text(source.replace(anchor2, replacement2, 1))

          swift = Path("sing-box-for-apple/Library/Network/ExtensionPlatformInterface.swift")
          source = swift.read_text()
          anchor = "        let path = nwMonitor.currentPath\n        if path.status == .unsatisfied {"
          replacement = "        let path = nwMonitor.currentPath\n        NSLog(\"[sing-box] NETWORK_DIAG NWPath status=%@ interfaces=%@\", String(describing: path.status), path.availableInterfaces.map { \"\\($0.name)#\\($0.index)/\\($0.type)\" }.joined(separator: \",\"))\n        if path.status == .unsatisfied {"
          if source.count(anchor) != 1:
              raise SystemExit("Swift NWPath diagnostic insertion anchor is not unique")
          swift.write_text(source.replace(anchor, replacement, 1))
          print("Added diagnostic-only logs for NWPath interfaces and Go net.FlagUp filtering")
          PY

      - name: Build Libbox framework
        working-directory: sing-box
        run: |
          go run ./cmd/internal/build_libbox -target apple

      - name: Make shared directory initialization fail-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("sing-box-for-apple/Library/Shared/FilePath.swift")
          text = source.read_text()
          old = "    private static let defaultSharedDirectory: URL! = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: groupName)"
          new = """    private static let defaultSharedDirectory: URL? = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: groupName)

              private static let resolvedSharedDirectory: URL = {
                  if let sharedDirectory = defaultSharedDirectory {
                      return sharedDirectory
                  }
                  let applicationSupport = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask).first
                      ?? FileManager.default.temporaryDirectory
                  let fallbackDirectory = applicationSupport.appendingPathComponent(packageName, isDirectory: true)
                  try? FileManager.default.createDirectory(at: fallbackDirectory, withIntermediateDirectories: true)
                  NSLog("[sing-box] App Group container unavailable; using local fallback directory: %@", fallbackDirectory.path)
                  return fallbackDirectory
              }()"""
          if old in text:
              text = text.replace(old, new, 1)
          if "private static let resolvedSharedDirectory: URL" not in text:
              raise SystemExit("Could not establish resolvedSharedDirectory; refusing unsafe patch")
          marker = "#if os(iOS)"
          head, tail = text.split(marker, 1)
          tail = tail.replace("defaultSharedDirectory", "resolvedSharedDirectory")
          tail = tail.replace("resolvedSharedDirectory!", "resolvedSharedDirectory")
          source.write_text(head + marker + tail)
          print("FilePath now handles an unavailable shared container without force-unwrapping nil")
          PY

      - name: Add shared diagnostics log and visible profile import errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path("sing-box-for-apple")
          fp = base / "Library/Shared/FilePath.swift"
          text = fp.read_text()
          anchor = "    public static let groupName = AppConfiguration.appGroupID\n"
          additions = '''
              public static var diagnosticLogURL: URL {
                  resolvedSharedDirectory.appendingPathComponent("diagnostics.log", isDirectory: false)
              }

              public static var appGroupContainerPath: String {
                  defaultSharedDirectory?.path ?? "UNAVAILABLE"
              }

              public static func appendDiagnosticLog(_ message: String) {
                  let groupPath = defaultSharedDirectory?.path ?? "UNAVAILABLE"
                  let timestamp = ISO8601DateFormatter().string(from: Date())
                  let line = "[\\(timestamp)] [\\(ProcessInfo.processInfo.processName)] AppGroupID=\\(groupName) AppGroupContainer=\\(groupPath) LogPath=\\(diagnosticLogURL.path) \\(message)\\n"
                  do {
                      try FileManager.default.createDirectory(at: resolvedSharedDirectory, withIntermediateDirectories: true)
                      if !FileManager.default.fileExists(atPath: diagnosticLogURL.path) {
                          FileManager.default.createFile(atPath: diagnosticLogURL.path, contents: nil)
                      }
                      let handle = try FileHandle(forWritingTo: diagnosticLogURL)
                      defer { try? handle.close() }
                      try handle.seekToEnd()
                      try handle.write(contentsOf: Data(line.utf8))
                  } catch {
                      NSLog("[sing-box] DIAGNOSTIC_LOG_WRITE_FAILED path=%@ error=%@", diagnosticLogURL.path, error.localizedDescription)
                  }
              }

              public static func readDiagnosticLog() -> String {
                  (try? String(contentsOf: diagnosticLogURL, encoding: .utf8)) ?? "No diagnostic log found at: \\(diagnosticLogURL.path)"
              }
          '''
          if "public static func appendDiagnosticLog" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("FilePath groupName anchor missing or ambiguous")
              text = text.replace(anchor, anchor + additions, 1)
              fp.write_text(text)

          ext = base / "Library/Network/ExtensionProvider.swift"
          text = ext.read_text()
          start = "    override open func startTunnel(options startOptions: [String: NSObject]?) async throws {"
          insert = start + '\n        FilePath.appendDiagnosticLog("VPN_EXTENSION_START groupContainer=\\(FilePath.appGroupContainerPath)")'
          if "VPN_EXTENSION_START groupContainer=" not in text:
              if text.count(start) != 1:
                  raise SystemExit("Extension startTunnel anchor missing or ambiguous")
              text = text.replace(start, insert, 1)
              ext.write_text(text)

          model = base / "ApplicationLibrary/Views/Profile/NewProfileViewModel.swift"
          text = model.read_text()
          init_anchor = "        super.init()\n"
          if "APP_START profile-import-view-model" not in text:
              if text.count(init_anchor) != 1:
                  raise SystemExit("NewProfileViewModel init anchor missing or ambiguous")
              text = text.replace(init_anchor, init_anchor + '        FilePath.appendDiagnosticLog("APP_START profile-import-view-model groupContainer=\\(FilePath.appGroupContainerPath)")\n', 1)

          catch_line = 'alert = AlertState(action: "create profile", error: error)'
          catch_line_replacement = """let selectedPath = fileURL?.path ?? "(no file URL)"
                      FilePath.appendDiagnosticLog("PROFILE_CREATE_FAILED filePath=\\(selectedPath) error=\\(error.localizedDescription)")
                      if profileType == .local && fileImport {
                          alert = AlertState(errorMessage: "读配置失败\\n文件路径：\\(selectedPath)\\n错误原因：\\(error.localizedDescription)")
                      } else {
                          alert = AlertState(action: "create profile", error: error)
                      }"""
          if "PROFILE_CREATE_FAILED filePath=" not in text:
              if text.count(catch_line) != 1:
                  raise SystemExit(f"Expected one create-profile error assignment, found {text.count(catch_line)}")
              text = text.replace(catch_line, catch_line_replacement, 1)


          text = text.replace(
              'configContent = importedFileContent',
              'configContent = importedFileContent\n                              FilePath.appendDiagnosticLog("PROFILE_IMPORT_CONTENT_READY filePath=\\(fileURL?.path ?? "(captured content)") bytes=\\(configContent.utf8.count)")',
              1
          )
          model.write_text(text)

          view = base / "ApplicationLibrary/Views/Profile/NewProfileView.swift"
          text = view.read_text()
          old = "viewModel.fileURL = urls[0]"
          new = '''let selectedURL = urls[0]
                              viewModel.fileURL = selectedURL
                              do {
                                  let content = try selectedURL.withSecurityScopedAccess {
                                      try String(contentsOf: selectedURL, encoding: .utf8)
                                  }
                                  viewModel.fileContent = content
                                  FilePath.appendDiagnosticLog("FILE_READ_OK filePath=\\(selectedURL.path) bytes=\\(content.utf8.count)")
                              } catch {
                                  viewModel.fileContent = nil
                                  FilePath.appendDiagnosticLog("FILE_READ_FAILED filePath=\\(selectedURL.path) error=\\(error.localizedDescription)")
                                  viewModel.alert = AlertState(errorMessage: "读配置失败\\n文件路径：\\(selectedURL.path)\\n错误原因：\\(error.localizedDescription)")
                              }'''
          count = text.count(old)
          if count == 2:
              text = text.replace(old, new)
          elif count != 0:
              raise SystemExit(f"Expected two file importer callbacks, found {count}")
          
          if "诊断日志" not in text:
              section = '''
                  Section("诊断") {
                      NavigationLink("查看诊断日志") {
                          DiagnosticLogView()
                      }
                      if #available(iOS 16.0, macOS 13.0, *) {
                          ShareLink("分享诊断日志", item: FilePath.diagnosticLogURL)
                      }
                  }
              '''
              form_anchor = "            #if os(iOS) || os(tvOS)\n                Section {"
              if text.count(form_anchor) != 1:
                  raise SystemExit("Could not locate profile form insertion point for diagnostics")
              text = text.replace(form_anchor, section + "\n" + form_anchor, 1)
              text += '''

          private struct DiagnosticLogView: View {
              @State private var logText = ""

              var body: some View {
                  ScrollView {
                      Text(logText.isEmpty ? "暂无诊断日志" : logText)
                          .font(.system(.caption, design: .monospaced))
                          .textSelection(.enabled)
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .padding()
                  }
                  .navigationTitle("诊断日志")
                  .onAppear {
                      logText = FilePath.readDiagnosticLog()
                  }
              }
          }
          '''
          view.write_text(text)

          print("Added shared App Group diagnostic log, startup checks, file-read details, and in-app view/share UI.")
          PY

      - name: Allow selecting JSON configuration files in both iOS importers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          menu = Path("sing-box-for-apple/ApplicationLibrary/Views/Profile/NewProfileMenuView.swift")
          lines = menu.read_text().splitlines()
          marker = "private static var importContentTypes: [UTType] {"
          matches = [i for i, line in enumerate(lines) if marker in line]
          if len(matches) != 1:
              raise SystemExit(f"Expected one importContentTypes declaration, found {len(matches)}")
          start = matches[0]
          end = next((i for i in range(start + 1, len(lines)) if lines[i].strip() == "}"), None)
          if end is None:
              raise SystemExit("Could not locate importContentTypes closing brace")
          lines[start + 1:end] = ["            [.data]"]
          text = "\n".join(lines) + "\n"

          old_dispatch = 'if url.pathExtension.lowercased() == "json"'
          new_dispatch = 'if url.pathExtension.lowercased() != "bpf"'
          if text.count(old_dispatch) != 1:
              raise SystemExit("Could not uniquely locate menu JSON import dispatch")
          text = text.replace(old_dispatch, new_dispatch, 1)
          menu.write_text(text)

          profile = Path("sing-box-for-apple/ApplicationLibrary/Views/Profile/NewProfileView.swift")
          view = profile.read_text()
          old_picker = "allowedContentTypes: [.json]"
          if view.count(old_picker) != 2:
              raise SystemExit(f"Expected two profile JSON pickers, found {view.count(old_picker)}")
          profile.write_text(view.replace(old_picker, "allowedContentTypes: [.data]"))

          print("Both iOS importers accept generic data files; Swift braces preserved")
          PY

      - name: Fix local file URL access during profile import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cases = [
              (
                  Path("sing-box-for-apple/ApplicationLibrary/Views/Profile/NewProfileMenuView.swift"),
                  r'try url\.withRequiredSecurityScopedAccess\([\s\S]*?\)\s*\{\s*try Data\(contentsOf: url\)\s*\}',
                  "try url.withSecurityScopedAccess {\n                            try Data(contentsOf: url)\n                        }",
              ),
              (
                  Path("sing-box-for-apple/ApplicationLibrary/Views/Profile/NewProfileViewModel.swift"),
                  r'configContent = try fileURL\.withRequiredSecurityScopedAccess\([\s\S]*?\)\s*\{\s*try String\(contentsOf: fileURL\)\s*\}',
                  "configContent = try fileURL.withSecurityScopedAccess {\n                                try String(contentsOf: fileURL)\n                            }",
              ),
          ]

          for path, pattern, replacement in cases:
              source = path.read_text()
              updated, count = re.subn(pattern, lambda _: replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f"Expected exactly one target file-read block in {path}, found {count}")
              path.write_text(updated)
              print(f"Patched {path}")
          PY

      - name: Read imported configuration while file-provider access is active
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("sing-box-for-apple/ApplicationLibrary/Views/Profile")
          menu = root / "NewProfileMenuView.swift"
          source = menu.read_text()
          old = 'localImportRequest = NewProfileView.LocalImportRequest(name: fileName, fileURL: url)'
          new = '''let configContent = try url.withSecurityScopedAccess {
                                  try String(contentsOf: url, encoding: .utf8)
                              }
                              localImportRequest = NewProfileView.LocalImportRequest(name: fileName, configContent: configContent)'''
          if source.count(old) != 1:
              raise SystemExit("Expected one JSON import handoff in menu")
          menu.write_text(source.replace(old, new, 1))

          view = root / "NewProfileView.swift"
          source = view.read_text()
          pattern = r'public struct LocalImportRequest: Hashable, Identifiable \{.*?\n    \}'
          replacement = '''public struct LocalImportRequest: Hashable, Identifiable {
                  public var id: String { name + configContent }
                  public let name: String
                  public let configContent: String

                  public init(name: String, configContent: String) {
                      self.name = name
                      self.configContent = configContent
                  }
              }'''
          source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not replace LocalImportRequest declaration")
          view.write_text(source)

          model = root / "NewProfileViewModel.swift"
          source = model.read_text()
          anchor = "    @Published public var fileURL: URL?\n"
          if source.count(anchor) != 1:
              raise SystemExit("fileURL property anchor missing")
          source = source.replace(anchor, anchor + "    @Published public var fileContent: String?\n", 1)

          old = "            fileURL = localImportRequest.fileURL"
          if source.count(old) != 1:
              raise SystemExit("LocalImportRequest initializer handoff missing")
          source = source.replace(old, "            fileContent = localImportRequest.configContent", 1)

          anchor = "        let fileURL = await fileURL\n"
          if source.count(anchor) != 1:
              raise SystemExit("Background fileURL capture missing")
          source = source.replace(anchor, anchor + "        let importedFileContent = await fileContent\n", 1)

          pattern = r'guard let fileURL else \{\s*throw NSError\(domain: "NewProfileViewModel".*?\n\s*\}\s*configContent = try fileURL\.withSecurityScopedAccess \{\s*try String\(contentsOf: fileURL\)\s*\}'
          replacement = '''guard let importedFileContent else {
                                  throw NSError(domain: "NewProfileViewModel", code: 0, userInfo: [NSLocalizedDescriptionKey: String(localized: "Missing imported file content")])
                              }
                              configContent = importedFileContent'''
          source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not replace deferred URL read in profile creation")
          model.write_text(source)

          print("Patched menu JSON import to read during security scope; profile creation now validates and saves captured UTF-8 text.")
          PY

      - name: Verify native SwiftUI file importer on iOS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("sing-box-for-apple/ApplicationLibrary/Views/Profile/NewProfileMenuView.swift")
          source = path.read_text()
          if ".fileImporter(" not in source:
              raise SystemExit("Native SwiftUI fileImporter is missing")
          if "handleFileImport(result)" not in source:
              raise SystemExit("Native importer callback is not connected")
          if "IOSNativeDocumentPicker" in source:
              raise SystemExit("Unexpected UIKit document picker remains in source")
          print("Verified native SwiftUI importer and callback; no replacement required.")
          PY

      - name: Ignore picker cancellation and trace file import stages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("sing-box-for-apple/ApplicationLibrary/Views/Profile/NewProfileMenuView.swift")
          source = path.read_text()

          # Instrument only the menu import handler; do not depend on indentation
          # or on a particular spelling of the JSON read implementation.
          pattern = r'(private func handleFileImport\(_ result: Result<\[URL\], Error>\) \{\s*Task \{ @MainActor in)'
          source, count = re.subn(pattern, r'\1\n                FilePath.appendDiagnosticLog("FILE_IMPORT_HANDLER_ENTER")', source, count=1)
          if count != 1:
              raise SystemExit("Could not locate handleFileImport entry")

          result_line = "let urls = try result.get()"
          if source.count(result_line) != 1:
              raise SystemExit(f"Expected one result.get() in menu handler, found {source.count(result_line)}")
          source = source.replace(result_line, 'FilePath.appendDiagnosticLog("FILE_IMPORT_RESULT_RECEIVED")\n                    ' + result_line, 1)

          selected_pattern = r'(guard let url = urls\.first else \{ return \})'
          source, count = re.subn(
              selected_pattern,
              r'guard let url = urls.first else { FilePath.appendDiagnosticLog("FILE_IMPORT_EMPTY_URL_LIST"); return }\n                    FilePath.appendDiagnosticLog("FILE_IMPORT_SELECTED path=\\(url.path) extension=\\(url.pathExtension.lowercased())")',
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Could not locate selected URL guard")

          catch_line = 'alert = AlertState(action: "read imported profile file", error: error)'
          if source.count(catch_line) != 1:
              raise SystemExit(f"Expected one import error handler, found {source.count(catch_line)}")
          catch_replacement = '''if let cocoaError = error as? CocoaError, cocoaError.code == .userCancelled {
                          FilePath.appendDiagnosticLog("FILE_IMPORT_CANCELLED_IGNORED")
                          return
                      }
                      FilePath.appendDiagnosticLog("FILE_IMPORT_FAILED error=\\(error.localizedDescription)")
                      alert = AlertState(action: "read imported profile file", error: error)'''
          source = source.replace(catch_line, catch_replacement, 1)

          path.write_text(source)
          print("Picker cancellation is silent; handler, result, selected URL and failure stages are logged.")
          PY

      - name: Read selected files immediately inside importer callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("sing-box-for-apple/ApplicationLibrary/Views/Profile/NewProfileMenuView.swift")
          source = path.read_text()
          pattern = r'        private func handleFileImport\(_ result: Result<\[URL\], Error>\) \{[\s\S]*?\n        \}'
          replacement = r'''        private func handleFileImport(_ result: Result<[URL], Error>) {
                  FilePath.appendDiagnosticLog("FILE_IMPORT_HANDLER_ENTER")
                  do {
                      let urls = try result.get()
                      FilePath.appendDiagnosticLog("FILE_IMPORT_RESULT_RECEIVED count=\(urls.count)")
                      guard let url = urls.first else {
                          FilePath.appendDiagnosticLog("FILE_IMPORT_EMPTY_URL_LIST")
                          return
                      }
                      let fileExtension = url.pathExtension.lowercased()
                      FilePath.appendDiagnosticLog("FILE_IMPORT_SELECTED path=\(url.path) extension=\(fileExtension)")

                      if fileExtension != "bpf" {
                          let fileName = url.deletingPathExtension().lastPathComponent
                          do {
                              let configContent = try url.withRequiredSecurityScopedAccess(
                                  or: NSError(domain: "NewProfileMenuView", code: 0, userInfo: [NSLocalizedDescriptionKey: String(localized: "Missing access to selected file")])
                              ) {
                                  try String(contentsOf: url, encoding: .utf8)
                              }
                              FilePath.appendDiagnosticLog("FILE_READ_OK bytes=\(configContent.utf8.count)")
                              localImportRequest = NewProfileView.LocalImportRequest(name: fileName, configContent: configContent)
                              FilePath.appendDiagnosticLog("PROFILE_IMPORT_CONTENT_READY name=\(fileName) bytes=\(configContent.utf8.count)")
                          } catch {
                              FilePath.appendDiagnosticLog("FILE_READ_FAILED error=\(error.localizedDescription)")
                              alert = AlertState(errorMessage: "读配置失败\n文件：\(fileName)\n错误原因：\(error.localizedDescription)")
                          }
                          return
                      }

                      let data = try url.withRequiredSecurityScopedAccess(
                          or: NSError(domain: "NewProfileMenuView", code: 0, userInfo: [NSLocalizedDescriptionKey: String(localized: "Missing access to selected file")])
                      ) {
                          try Data(contentsOf: url)
                      }
                      let content = try LibboxProfileContent.from(data)

                      alert = AlertState(
                          title: String(localized: "Import Profile"),
                          message: String(localized: "Are you sure to import profile \(content.name)?"),
                          primaryButton: .default(String(localized: "Import")) {
                              Task {
                                  do {
                                      try await content.importProfile()
                                      environments.profileUpdate.send()
                                      complete()
                                  } catch {
                                      alert = AlertState(action: "import profile", error: error)
                                  }
                              }
                          },
                          secondaryButton: .cancel()
                      )
                  } catch {
                      if let cocoaError = error as? CocoaError, cocoaError.code == .userCancelled {
                          FilePath.appendDiagnosticLog("FILE_IMPORT_CANCELLED")
                          return
                      }
                      FilePath.appendDiagnosticLog("FILE_IMPORT_FAILED error=\(error.localizedDescription)")
                      alert = AlertState(action: "read imported profile file", error: error)
                  }
              }'''
          updated, count = re.subn(pattern, lambda _: replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"Expected one handleFileImport function, found {count}")
          path.write_text(updated)
          print("Replaced deferred file read with immediate security-scoped read in SwiftUI importer callback.")
          PY

      - name: Use loopback TCP for iOS command channel
        run: |
          python3 - <<'PY'
          from pathlib import Path

          secret = "sb-ios-local-command-7f4a9c2e81d6b305"


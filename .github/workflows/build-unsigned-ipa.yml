name: Build Unsigned sing-box iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: Clone sing-box core
        run: |
          git clone --depth 1 --branch testing \
            https://github.com/SagerNet/sing-box.git sing-box

      - name: Clone Apple client and submodules
        run: |
          git clone --depth 1 --branch dev --recurse-submodules \
            https://github.com/SagerNet/sing-box-for-apple.git sing-box-for-apple

      - name: Patch SwiftUI toolbar availability
        working-directory: sing-box-for-apple
        run: |
          python3 - <<'PATCHPY'
          from pathlib import Path

          path = Path("SFI/MainView.swift")
          source = path.read_text()

          function_start = source.find("private func sidebarPageContent")
          if function_start < 0:
              raise SystemExit("sidebarPageContent not found")

          toolbar_start = source.find(".toolbar {", function_start)
          if toolbar_start < 0:
              raise SystemExit("toolbar block not found")

          open_brace = source.find("{", toolbar_start)
          depth = 0
          close_brace = -1

          for i in range(open_brace, len(source)):
              if source[i] == "{":
                  depth += 1
              elif source[i] == "}":
                  depth -= 1
                  if depth == 0:
                      close_brace = i
                      break

          if close_brace < 0:
              raise SystemExit("Unbalanced toolbar braces")

          line_start = source.rfind("\\n", 0, toolbar_start) + 1
          indent = source[line_start:toolbar_start]

          replacement = """.toolbar {
              ToolbarItem(placement: .topBarLeading) {
                  if remoteControlInToolbar,
                     environments.remoteServer != nil || !remoteServers.isEmpty {
                      remoteControlPicker
                  }
              }
              ToolbarItem(placement: .topBarLeading) {
                  serviceToolbarItem
              }
          }"""

          replacement = replacement.replace("\\n", "\\n" + indent)
          result = source[:toolbar_start] + replacement + source[close_brace + 1:]

          path.write_text(result)
          print("Toolbar patch applied successfully.")
          PATCHPY

          echo "Checking patched source..."
          grep -n -A15 -B2 'private func sidebarPageContent' SFI/MainView.swift

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache-dependency-path: sing-box/go.sum

      - name: Install gomobile tools
        working-directory: sing-box
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12

      - name: Build Libbox framework
        working-directory: sing-box
        run: |
          go run ./cmd/internal/build_libbox -target apple

      - name: Build unsigned iOS IPA
        run: |
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh sing-box-for-apple SFI

      - name: Upload IPA and crash diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-diagnostic-build
          path: |
            output/*.ipa
            output/diagnostics/**
          if-no-files-found: error
          retention-days: 90

name: Build Unsigned sing-box iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: Clone sing-box core
        run: |
          git clone --depth 1 --branch testing \
            https://github.com/SagerNet/sing-box.git sing-box

      - name: Clone Apple client and submodules
        run: |
          git clone --depth 1 --branch dev --recurse-submodules \
            https://github.com/SagerNet/sing-box-for-apple.git sing-box-for-apple

      - name: Disable custom Go crash-signal chaining for launch diagnosis
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("sing-box-for-apple/SFI/ApplicationDelegate.swift")
          text = source.read_text()
          calls = [
              "        LibboxPrepareCrashSignalHandlers()\n",
              "        NativeCrashReporter.installForCurrentProcess()\n",
              "        LibboxReinstallCrashSignalHandlers()\n",
          ]
          for call in calls:
              if call not in text:
                  raise SystemExit(f"Expected launch signal-handler call not found: {call.strip()}")
              text = text.replace(call, "", 1)
          text = text.replace("import Libbox\n", "", 1)
          source.write_text(text)
          print("Removed app-process signal-handler chain for one diagnostic build")
          PY

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache-dependency-path: sing-box/go.sum

      - name: Install gomobile tools
        working-directory: sing-box
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12

      - name: Build Libbox framework
        working-directory: sing-box
        run: |
          go run ./cmd/internal/build_libbox -target apple

      - name: Patch iOS 16 availability boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("sing-box-for-apple/SFI/MainView.swift")
          text = source.read_text()
          declaration = "    private func sidebarPageContent(for page: NavigationPage, remoteControlInToolbar: Bool) -> some View {"
          annotated = "    @available(iOS 16.0, *)\n" + declaration

          if annotated in text:
              print("Availability annotation already present; no change needed")
          elif text.count(declaration) == 1:
              source.write_text(text.replace(declaration, annotated, 1))
              print("Marked sidebarPageContent as iOS 16+, matching its only call sites")
          else:
              raise SystemExit("Expected MainView.swift declaration exactly once; refusing unsafe patch")
          PY

      - name: Build unsigned iOS IPA
        run: |
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh sing-box-for-apple SFI

      - name: Upload IPA, signing entitlements and crash diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-v10-signal-diagnostic
          path: |
            output/*.ipa
            output/signing-entitlements/**
            output/diagnostics/**
          if-no-files-found: error
          retention-days: 90

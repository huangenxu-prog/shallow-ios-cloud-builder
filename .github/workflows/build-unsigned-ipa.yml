name: Build Unsigned sing-box iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: Clone sing-box core
        run: |
          git clone --depth 1 --branch testing \
            https://github.com/SagerNet/sing-box.git sing-box

      - name: Clone Apple client and submodules
        run: |
          git clone --depth 1 --branch dev --recurse-submodules \
            https://github.com/SagerNet/sing-box-for-apple.git sing-box-for-apple

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache-dependency-path: sing-box/go.sum

      - name: Install gomobile tools
        working-directory: sing-box
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12

      - name: Build Libbox framework
        working-directory: sing-box
        run: |
          go run ./cmd/internal/build_libbox -target apple

      - name: Make shared directory initialization fail-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("sing-box-for-apple/Library/Shared/FilePath.swift")
          text = source.read_text()
          old = "    private static let defaultSharedDirectory: URL! = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: groupName)"
          new = """    private static let defaultSharedDirectory: URL? = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: groupName)

              private static let resolvedSharedDirectory: URL = {
                  if let sharedDirectory = defaultSharedDirectory {
                      return sharedDirectory
                  }
                  let applicationSupport = FileManager.default.urls(for: .applicationSupportDirectory, in: .userDomainMask).first
                      ?? FileManager.default.temporaryDirectory
                  let fallbackDirectory = applicationSupport.appendingPathComponent(packageName, isDirectory: true)
                  try? FileManager.default.createDirectory(at: fallbackDirectory, withIntermediateDirectories: true)
                  NSLog("[sing-box] App Group container unavailable; using local fallback directory: %@", fallbackDirectory.path)
                  return fallbackDirectory
              }()"""
          if "private static let resolvedSharedDirectory: URL" in text:
              print("Fail-safe shared directory patch already present")
          elif old in text:
              text = text.replace(old, new, 1)
              text = text.replace("public static let sharedDirectory = defaultSharedDirectory!", "public static let sharedDirectory = resolvedSharedDirectory", 1)
              source.write_text(text)
              print("Replaced force unwrap with a logged local fallback")
          else:
              raise SystemExit("Expected FilePath.swift declaration not found; refusing unsafe patch")
          PY

      - name: Patch iOS 16 availability boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("sing-box-for-apple/SFI/MainView.swift")
          text = source.read_text()
          declaration = "    private func sidebarPageContent(for page: NavigationPage, remoteControlInToolbar: Bool) -> some View {"
          annotated = "    @available(iOS 16.0, *)\n" + declaration

          if annotated in text:
              print("Availability annotation already present; no change needed")
          elif text.count(declaration) == 1:
              source.write_text(text.replace(declaration, annotated, 1))
              print("Marked sidebarPageContent as iOS 16+, matching its only call sites")
          else:
              raise SystemExit("Expected MainView.swift declaration exactly once; refusing unsafe patch")
          PY

      - name: Build unsigned iOS IPA
        run: |
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh sing-box-for-apple SFI

      - name: Upload IPA, signing entitlements and crash diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-author-source-ipa
          path: |
            output/*.ipa
            output/signing-entitlements/**
            output/diagnostics/**
          if-no-files-found: error
          retention-days: 90
